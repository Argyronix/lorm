# Blank issues stay enabled because SUPPORT.md tells people to open one for a
# general question and promises it will be relabelled if it is neither a bug
# nor a feature request. With blank issues off, that promise cannot be kept:
# the chooser offers only the two templates, and someone with a question has
# to misfile it as one of them. The templates remain the first thing the
# chooser shows, so structured reports are still the default path.
blank_issues_enabled: true
contact_links:
  - name: Read the user guide first
    url: https://github.com/Argyronix/lorm/blob/main/docs/user-guide.md
    about: Plain-language intro, worked scenarios, and an FAQ — many questions are answered here before you need to file anything.
  - name: Report a security vulnerability
    url: https://github.com/Argyronix/lorm/security/policy
    about: Use this for anything that lets a gated action execute without the authorization LORM claims for it. Do not open a public issue for these.
